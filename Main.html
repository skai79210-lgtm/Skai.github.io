<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🍀A Little Question 💗🍀</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Quicksand:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: "Quicksand", sans-serif;

    background:
        radial-gradient(circle at 50% 45%, #fff8fa 0%, #ffdce8 35%, #f7b7cc 75%, #e99ab6 100%);

    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* Soft glow */

body::before {
    content: "";
    position: absolute;
    width: 700px;
    height: 700px;
    background: rgba(255,255,255,0.35);
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
}

/* =========================
   FLOWERS
========================= */

.flower {
    position: absolute;
    width: 270px;
    height: 270px;
    z-index: 1;
    opacity: 0.95;
}

.flower-left-top {
    left: -55px;
    top: -45px;
    transform: rotate(-15deg);
}

.flower-right-top {
    right: -50px;
    top: -30px;
    transform: rotate(20deg);
}

.flower-left-bottom {
    left: -60px;
    bottom: -60px;
    transform: rotate(15deg);
}

.flower-right-bottom {
    right: -55px;
    bottom: -55px;
    transform: rotate(-15deg);
}

.lily {
    width: 190px;
    height: 190px;
    position: absolute;
}

.petal {
    position: absolute;
    width: 65px;
    height: 105px;

    background: linear-gradient(
        135deg,
        #fffafa,
        #ffd8e5 60%,
        #f4a9c3
    );

    border-radius: 60% 60% 45% 45%;
    left: 62px;
    top: 42px;

    transform-origin: 50% 100%;

    box-shadow:
        inset 0 0 12px rgba(255,255,255,0.8),
        0 5px 15px rgba(130,50,80,0.12);
}

.petal:nth-child(1) {
    transform: rotate(0deg) translateY(-20px);
}

.petal:nth-child(2) {
    transform: rotate(60deg) translateY(-20px);
}

.petal:nth-child(3) {
    transform: rotate(120deg) translateY(-20px);
}

.petal:nth-child(4) {
    transform: rotate(180deg) translateY(-20px);
}

.petal:nth-child(5) {
    transform: rotate(240deg) translateY(-20px);
}

.petal:nth-child(6) {
    transform: rotate(300deg) translateY(-20px);
}

.flower-center {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #f1a23b;
    left: 80px;
    top: 80px;
    z-index: 5;
    box-shadow: 0 0 10px rgba(255,180,50,0.5);
}

/* Lily stems */

.stem {
    position: absolute;
    width: 8px;
    height: 150px;
    background: linear-gradient(to right, #607d4e, #9bad71);
    border-radius: 20px;
    bottom: -80px;
    left: 110px;
    transform: rotate(-12deg);
}

/* Leaves */

.leaf {
    position: absolute;
    width: 80px;
    height: 35px;
    background: linear-gradient(135deg, #607d4e, #a6b97b);
    border-radius: 100% 0 100% 0;
}

.leaf.one {
    left: 25px;
    bottom: 5px;
    transform: rotate(-25deg);
}

.leaf.two {
    left: 125px;
    bottom: 35px;
    transform: rotate(30deg);
}

/* =========================
   CARD
========================= */

.card {
    position: relative;
    z-index: 10;

    width: min(90%, 650px);
    min-height: 520px;

    padding: 60px 35px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    border: 1px solid rgba(255,255,255,0.8);

    border-radius: 35px;

    box-shadow:
        0 25px 70px rgba(150,70,100,0.18),
        inset 0 0 30px rgba(255,255,255,0.5);
}

.small-heart {
    font-size: 35px;
    margin-bottom: 15px;
    animation: heartbeat 1.4s infinite;
}

h1 {
    font-family: "DM Serif Display", serif;
    font-size: clamp(42px, 7vw, 68px);
    line-height: 1.05;
    color: #d84c7b;

    max-width: 550px;

    text-shadow: 0 2px 8px rgba(216,76,123,0.12);
}

.subtitle {
    margin-top: 25px;
    max-width: 500px;

    font-size: 18px;
    line-height: 1.7;

    color: #855365;
}

.question {
    margin-top: 10px;
    color: #c74372;
    font-weight: 600;
}

/* =========================
   BUTTONS
========================= */

.buttons {
    margin-top: 40px;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;

    min-height: 80px;
}

button {
    border: none;
    font-family: "Quicksand", sans-serif;
    font-size: 18px;
    font-weight: 700;

    cursor: pointer;

    border-radius: 100px;

    transition:
        transform 0.35s ease,
        opacity 0.35s ease,
        box-shadow 0.25s ease;
}

#yesBtn {
    padding: 18px 45px;

    color: white;

    background: linear-gradient(
        135deg,
        #ff6fa5,
        #ed477f
    );

    box-shadow:
        0 10px 25px rgba(237,71,127,0.3),
        inset 0 2px 5px rgba(255,255,255,0.4);
}

#yesBtn:hover {
    transform: scale(1.08);
    box-shadow: 0 15px 35px rgba(237,71,127,0.4);
}

#noBtn {
    padding: 15px 30px;

    color: #8e6874;

    background: rgba(255,255,255,0.75);

    box-shadow: 0 5px 15px rgba(120,70,90,0.12);
}

#noBtn:hover {
    transform: scale(1.03);
}

/* =========================
   SUCCESS MESSAGE
========================= */

#success {
    display: none;

    margin-top: 35px;

    font-family: "DM Serif Display", serif;
    font-size: 30px;

    color: #d93e72;

    animation: pop 0.7s ease;
}

/* =========================
   FLOATING PETALS
========================= */

.petal-float {
    position: absolute;
    top: -30px;

    font-size: 25px;

    pointer-events: none;

    animation: fall linear forwards;

    z-index: 5;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.18);
    }
}

@keyframes fall {
    0% {
        transform:
            translateY(-30px)
            rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(110vh)
            translateX(100px)
            rotate(360deg);
        opacity: 0;
    }
}

@keyframes pop {
    0% {
        transform: scale(0);
        opacity: 0;
    }

    70% {
        transform: scale(1.15);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .card {
        min-height: 480px;
        padding: 45px 22px;
    }

    h1 {
        font-size: 42px;
    }

    .subtitle {
        font-size: 16px;
    }

    .flower {
        transform: scale(0.7);
    }

    .flower-left-top {
        left: -100px;
        top: -80px;
    }

    .flower-right-top {
        right: -100px;
        top: -70px;
    }

    .flower-left-bottom {
        left: -100px;
        bottom: -100px;
    }

    .flower-right-bottom {
        right: -100px;
        bottom: -100px;
    }

    .buttons {
        gap: 12px;
    }

    #yesBtn {
        padding: 16px 32px;
    }

    #noBtn {
        padding: 13px 24px;
    }
}
</style>
</head>


<body>

<!-- =========================
     DECORATIVE LILIES
========================= -->

<div class="flower flower-left-top">
    <div class="stem"></div>
    <div class="leaf one"></div>
    <div class="leaf two"></div>

    <div class="lily">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="flower-center"></div>
    </div>
</div>


<div class="flower flower-right-top">
    <div class="stem"></div>
    <div class="leaf one"></div>
    <div class="leaf two"></div>

    <div class="lily">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="flower-center"></div>
    </div>
</div>


<div class="flower flower-left-bottom">
    <div class="stem"></div>
    <div class="leaf one"></div>
    <div class="leaf two"></div>

    <div class="lily">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="flower-center"></div>
    </div>
</div>


<div class="flower flower-right-bottom">
    <div class="stem"></div>
    <div class="leaf one"></div>
    <div class="leaf two"></div>

    <div class="lily">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="flower-center"></div>
    </div>
</div>


<!-- =========================
     MAIN CARD
========================= -->

<div class="card">

    <div class="small-heart">♡</div>

    <h1>
        Will you be<br>
        my girlfriend again?
    </h1>

    <p class="subtitle">
       I am so sorry for the apology letter writing isn't my best suit, however this is
    </p>

    <p class="question">
        So, what do you say will you be my girlfriend again? ♡
    </p>


    <div class="buttons">

        <button id="yesBtn">
            YES ♡
        </button>

        <button id="noBtn">
            NO 😭
        </button>

    </div>


    <div id="success">
        YAYYY! I knew you'd say yes! 💗
        <br>
        <span style="font-size:20px;">
            You just made me the happiest person ever 🥹
        </span>
    </div>

</div>


<script>

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const success = document.getElementById("success");

let noClicks = 0;


/* =========================
   NO BUTTON
========================= */

noBtn.addEventListener("click", () => {

    noClicks++;

    /*
        The button gets smaller
        with every click.
    */

    const scale = Math.max(
        0.05,
        1 - (noClicks * 0.17)
    );

    noBtn.style.transform = `scale(${scale})`;


    /*
        YES gets slightly bigger
    */

    const yesScale = 1 + (noClicks * 0.045);

    yesBtn.style.transform =
        `scale(${yesScale})`;


    /*
        Change NO text
    */

    const messages = [
        "Are you sure? 🥺",
        "PLeasee? 😭",
        "Think again... 💔",
        "Babbbyyy? 🥹",
        "Don't do this 😭",
        "One more chance? 💗"
    ];

    if (noClicks <= messages.length) {
        noBtn.innerText = messages[noClicks - 1];
    }


    /*
        Eventually disappear
    */

    if (noClicks >= 6) {

        noBtn.style.opacity = "0";
        noBtn.style.pointerEvents = "none";
        noBtn.style.transform = "scale(0)";

        setTimeout(() => {
            noBtn.style.display = "none";
        }, 350);
    }

});


/* =========================
   YES BUTTON
========================= */

yesBtn.addEventListener("click", () => {

    document.querySelector(".buttons").style.display = "none";

    success.style.display = "block";

    createHearts();

});


/* =========================
   FLOATING PETALS
========================= */

function createPetal() {

    const petal = document.createElement("div");

    petal.className = "petal-float";

    petal.innerText = "🍀";

    petal.style.left =
        Math.random() * 100 + "vw";

    petal.style.animationDuration =
        (Math.random() * 5 + 5) + "s";

    petal.style.fontSize =
        (Math.random() * 15 + 15) + "px";

    document.body.appendChild(petal);

    setTimeout(() => {
        petal.remove();
    }, 10000);
}


/* Keep petals falling */

setInterval(createPetal, 700);


/* =========================
   HEART CELEBRATION
========================= */

function createHearts() {

    for (let i = 0; i < 50; i++) {

        setTimeout(() => {

            const heart = document.createElement("div");

            heart.className = "petal-float";

            const hearts = [
                "💗",
                "💕",
                "💖",
                "💘",
                "❤️",
                "🌸"
            ];

            heart.innerText =
                hearts[Math.floor(Math.random() * hearts.length)];

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.animationDuration =
                (Math.random() * 3 + 3) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);

        }, i * 80);
    }
}

</script>

</body>
</html>
